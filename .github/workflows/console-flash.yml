# Windows-only validation for the hook-command console flash (PR #42).
#
# Kept as its own workflow rather than a job in validate.yml because it is
# the only check that needs a real desktop session: it asserts a window
# does NOT appear, which is worthless unless the same session is first seen
# to produce one. The script exits 3 when it cannot see the control's
# window, so a runner that cannot show windows fails loudly instead of
# reporting a green "no flash".
name: Console flash (Windows)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "assets/hook-runner.vbs"
      - "src/utils/hook-command.ts"
      - "src/cli/hook-manifest.ts"
      - "scripts/validate-console-flash.ps1"
      - ".github/workflows/console-flash.yml"
  push:
    branches:
      - "fix/windows-console-flash*"
permissions:
  contents: read
jobs:
  console-flash:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile (the unit tests import from dist/)
        run: npx tsc
      - name: Unit tests for the command builder
        run: node --test tests/hook-command.test.ts
      - name: Session diagnostics
        shell: pwsh
        run: |
          # Recorded because it is the first thing to check when the
          # validation comes back inconclusive.
          Write-Host "user           : $env:USERNAME"
          Write-Host "session id     : $((Get-Process -Id $PID).SessionId)"
          Write-Host "interactive    : $([Environment]::UserInteractive)"
          Write-Host "window station : $((Get-Process -Id $PID).SI)"
          Write-Host "os             : $((Get-CimInstance Win32_OperatingSystem).Caption)"
      - name: Validate the console flash
        shell: pwsh
        run: ./scripts/validate-console-flash.ps1
